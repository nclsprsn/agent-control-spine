global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "registry"
    metrics_path: /metrics
    static_configs:
      - targets: ["registry:8081"]

  - job_name: "catalog"
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog:8082"]

  - job_name: "observer"
    metrics_path: /metrics
    static_configs:
      - targets: ["observer:8083"]

  - job_name: "chat"
    metrics_path: /metrics
    static_configs:
      - targets: ["chat:8084"]
