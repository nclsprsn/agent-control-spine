[project]
name = "agent-control-spine"
version = "0.1.0"
description = "Enterprise control plane for AI agents"
readme = "README.md"
requires-python = ">=3.14"

[tool.uv.workspace]
members = [
    "services/*",
    "libs/*",
    "agents",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.1",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["services/*/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "S",
    "T20",
    "SIM",
    "RUF",
]
ignore = ["B008", "S104", "UP046"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"agents/*" = ["T201"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["services/.*/migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires running Docker stack (make dev)",
    "ollama: requires Ollama with qwen3:8b model",
]
