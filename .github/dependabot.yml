version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/dashboard"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/chat"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/services/registry"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/services/catalog"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/services/chat"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/services/observer"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/dashboard"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/chat"
    schedule:
      interval: weekly
