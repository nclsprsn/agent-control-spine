[project]
name = "chat"
version = "0.1.0"
description = "Chat orchestration service for Agent Control Spine"
requires-python = ">=3.14"
dependencies = [
    "spine-common",
    "pydantic-ai>=1.0",
    "redis[hiredis]>=5.0",
    "sse-starlette>=2.2",
    "alembic>=1.15",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat"]

[tool.uv.sources]
spine-common = { workspace = true }
