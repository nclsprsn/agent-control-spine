[project]
name = "agent-control-spine"
version = "0.1.0"
description = "Enterprise control plane for AI agents"
readme = "README.md"
requires-python = ">=3.14"

[tool.uv.workspace]
members = [
    "services/*",
    "libs/*",
    "agents",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.1",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "S",
    "T20",
    "SIM",
    "RUF",
]
ignore = ["S104"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
