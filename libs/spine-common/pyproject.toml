[project]
name = "spine-common"
version = "0.1.0"
description = "Shared library for Agent Control Spine services"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.13",
    "pydantic-settings>=2.9",
    "structlog>=25.1",
    "opentelemetry-api>=1.33",
    "opentelemetry-sdk>=1.33",
    "opentelemetry-instrumentation-fastapi>=0.52b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.52b0",
    "python-jose[cryptography]>=3.4",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine_common"]
