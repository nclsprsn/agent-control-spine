[project]
name = "agents"
version = "0.1.0"
description = "Pydantic AI agent definitions for Agent Control Spine"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=1.106.0",
    "spine-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.uv.sources]
spine-common = { workspace = true }
