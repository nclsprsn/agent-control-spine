version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/dashboard"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/chat"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - "/"
      - "/services/registry"
      - "/services/catalog"
      - "/services/chat"
      - "/services/observer"
      - "/apps/dashboard"
      - "/apps/chat"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-images:
        patterns: ["*"]
