[project]
name = "observer"
version = "0.1.0"
description = "Observability service for Agent Control Spine"
requires-python = ">=3.14"
dependencies = [
    "spine-common",
    "nats-py>=2.10",
    "opentelemetry-exporter-otlp-proto-grpc>=1.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observer"]

[tool.uv.sources]
spine-common = { workspace = true }
