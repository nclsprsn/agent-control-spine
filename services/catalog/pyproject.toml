[project]
name = "catalog"
version = "0.1.0"
description = "Agent Catalog service for Agent Control Spine"
requires-python = ">=3.14"
dependencies = [
    "spine-common",
    "alembic>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.uv.sources]
spine-common = { workspace = true }
