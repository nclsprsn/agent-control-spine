services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spine-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-spine}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spine}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.14-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./infra/docker/nats/nats-server.conf:/etc/nats/nats-server.conf
    command: ["-c", "/etc/nats/nats-server.conf"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8443"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8443:8443"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: ["start-dev", "--import-realm"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:v1.2.1
    command: ["-f", "/app/config.yaml"]
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/docker/agentgateway/config.yaml:/app/config.yaml
    depends_on:
      keycloak:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml

  tempo:
    image: grafana/tempo:2.10.5
    ports:
      - "3200:3200"
    volumes:
      - ./infra/docker/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]

  loki:
    image: grafana/loki:3.7.2
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  prometheus:
    image: prom/prometheus:v3.11.3
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - tempo
      - loki
      - prometheus

  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spine}:${POSTGRES_PASSWORD:-spine-dev-password}@postgres:5432/langfuse
      NEXTAUTH_SECRET: langfuse-dev-secret
      SALT: langfuse-dev-salt
      NEXTAUTH_URL: http://localhost:3003
      HOSTNAME: "0.0.0.0"
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/public/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{process.exit(r.statusCode===200?0:1)})}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spine}:${POSTGRES_PASSWORD:-spine-dev-password}@postgres:5432/${POSTGRES_DB:-spine}
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: INFO
      KEYCLOAK_JWKS_URL: http://keycloak:8443/realms/spine/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8443/realms/spine
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8081/healthz\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spine}:${POSTGRES_PASSWORD:-spine-dev-password}@postgres:5432/${POSTGRES_DB:-spine}
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: INFO
      KEYCLOAK_JWKS_URL: http://keycloak:8443/realms/spine/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8443/realms/spine
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8082/healthz\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  observer:
    build:
      context: .
      dockerfile: services/observer/Dockerfile
    ports:
      - "8083:8083"
    environment:
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: INFO
      KEYCLOAK_JWKS_URL: http://keycloak:8443/realms/spine/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8443/realms/spine
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8083/healthz\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spine}:${POSTGRES_PASSWORD:-spine-dev-password}@postgres:5432/${POSTGRES_DB:-spine}
      REDIS_URL: redis://redis:6379/0
      REGISTRY_URL: http://registry:8081
      CATALOG_URL: http://catalog:8082
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: INFO
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_ENABLED: "true"
      KEYCLOAK_JWKS_URL: http://keycloak:8443/realms/spine/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8443/realms/spine
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry:
        condition: service_healthy
      langfuse:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8084/healthz\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Frontend Apps
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      INTERNAL_API_URL: http://agentgateway:8080
      AUTH_SECRET: ${AUTH_SECRET_DASHBOARD:-dev-dashboard-secret-change-in-production}
      AUTH_KEYCLOAK_ID: spine-dashboard
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET_DASHBOARD:-spine-dashboard-secret}
      AUTH_KEYCLOAK_ISSUER: http://keycloak:8443/realms/spine
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3001
      REGISTRY_URL: http://registry:8081
      CATALOG_URL: http://catalog:8082
      OBSERVER_URL: http://observer:8083
      CHAT_URL: http://chat:8084
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      agentgateway:
        condition: service_started
      registry:
        condition: service_healthy

  chat-app:
    build:
      context: apps/chat
      dockerfile: Dockerfile
    network_mode: host
    environment:
      AUTH_KEYCLOAK_ID: spine-chat
      AUTH_KEYCLOAK_SECRET: spine-chat-secret
      AUTH_KEYCLOAK_ISSUER: http://localhost:8443/realms/spine
      AUTH_SECRET: dev-secret-change-in-production-32chars
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3002
      GATEWAY_INTERNAL_URL: http://localhost:8080
    depends_on:
      chat:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
